# Splunk Universal Forwarder - Telemetry Ingestion Configuration
# Location: %SPLUNK_HOME%\etc\apps\Splunk-Windows-Forwarder\local\inputs.conf

[default]
host = Windows-Server-Target

# Ingest Windows Security Logs (Logon/Logoff, Kerberos, Privilege Use)
[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = main
renderXml = 1

# Ingest Windows System Logs (Service Installation, Driver Loads)
[WinEventLog://System]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = main
renderXml = 1

# Ingest Microsoft Sysmon Operational Logs (Process Creation, Network Connections, DNS Queries)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = main
renderXml = 1
